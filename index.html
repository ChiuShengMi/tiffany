<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Push Test Page</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      color: #1f2937;
      background: #f4f7fb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(720px, 100%);
      background: #ffffff;
      border: 1px solid #d8e0ea;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 16px 48px rgba(31, 41, 55, 0.08);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e7f7ef;
      color: #136f43;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 20px 0 12px;
      font-size: clamp(32px, 6vw, 56px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #4b5563;
      font-size: 18px;
      line-height: 1.8;
    }

    .meta {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      font-size: 15px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Push Test OK</span>
    <h1>網站已成功更新</h1>
    <p>如果你在線上網址看到這個頁面，代表 Git push 或部署流程已經成功。</p>
    <p class="meta">測試頁面：C:\Users\wwschu\Desktop\Project\index.html</p>
  </main>
</body>
</html>
